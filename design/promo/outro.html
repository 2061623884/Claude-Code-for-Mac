<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Promo · 片尾 26–30s</title>
<style>
  :root { --m: min(100vw, 100vh); --fg: #1f1e1d; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #faf9f5; color: var(--fg); }
  #card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #card > * { will-change: opacity, transform; }
  #title { margin: 0; font: 400 calc(var(--m) * 0.085)/1.1 ui-serif, "New York", Georgia, serif; letter-spacing: -0.01em; }
  #url { margin-top: calc(var(--m) * 0.05); padding: calc(var(--m) * 0.012) calc(var(--m) * 0.026); border-radius: 999px; background: #f0eee6; font: 500 calc(var(--m) * 0.022)/1.3 "SF Mono", Menlo, monospace; color: #3d3d3a; }
</style>
</head>
<body>
<div id="card">
  <h1 id="title">Claude Code for Mac</h1>
  <div id="url">github.com/2061623884/Claude-Code-for-Mac</div>
</div>

<script src="spark.js"></script>
<script>
const DURATION = 4000
const $ = id => document.getElementById(id)

// [元素, 入场开始, 入场结束]；配乐在 26.15s、26.5s 各有一声对应
const ENTER = [['title', 150, 650], ['url', 500, 950]]

function render(t) {
  const m = Math.min(innerWidth, innerHeight)
  for (const [id, a, b] of ENTER) {
    const p = smooth(a, b, t), el = $(id)
    el.style.opacity = p
    el.style.transform = `translateY(${(1 - outCubic(p)) * m * 0.02}px)`
  }
}

mountTimeline(render, DURATION)
</script>
</body>
</html>
